name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restaurar keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/girag.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/girag.jks" >> "$GITHUB_ENV"

      - name: Compilar release firmado
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon lintVitalRelease assembleRelease

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk GiragNFC.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GiragNFC-apk
          path: GiragNFC.apk

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" GiragNFC.apk \
            --title "Girag NFC $TAG" \
            --notes "APK firmado. Instalar en Android con NFC (permitir orígenes desconocidos)." \
            --latest
